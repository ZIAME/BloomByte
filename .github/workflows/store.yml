name: Build Microsoft Store package

# Runs on a Windows machine in GitHub's cloud and produces the .appx file
# to upload in Partner Center. Start it from the Actions tab ("Run workflow"),
# or it runs automatically whenever the desktop-app branch changes.
on:
  workflow_dispatch:
  push:
    branches: [desktop-app]

jobs:
  store-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the Store package (unsigned; Microsoft signs it after certification)
        run: npm run store

      - name: Show package identity (should match Partner Center)
        shell: pwsh
        run: |
          $appx = Get-ChildItem dist-store -Filter *.appx | Select-Object -First 1
          Write-Host "Package file: $($appx.Name)  ($([math]::Round($appx.Length/1MB,1)) MB)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
          $reader = New-Object System.IO.StreamReader($entry.Open())
          [xml]$m = $reader.ReadToEnd(); $reader.Close(); $zip.Dispose()
          Write-Host "Identity Name : $($m.Package.Identity.Name)"
          Write-Host "Publisher     : $($m.Package.Identity.Publisher)"
          Write-Host "Version       : $($m.Package.Identity.Version)"
          Write-Host "Display name  : $($m.Package.Properties.DisplayName)"
          Write-Host "Publisher name: $($m.Package.Properties.PublisherDisplayName)"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: BloomByte-Store-package
          path: dist-store/*.appx
          if-no-files-found: error
